name: macos

# 只跑与 macOS 端相关的改动：macos/ 源码与 shared/js（构建前会同步进包）。
on:
  pull_request:
    paths:
      - "macos/**"
      - "shared/js/**"
      - ".github/workflows/macos.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "shared/js/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 默认 Xcode 16（Swift 6）；Swift Testing 需要 Swift 6 工具链。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择带 Swift 6 的工具链
        run: |
          if swift --version | grep -q "Swift version 6"; then
            swift --version
            exit 0
          fi
          newest="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "${newest}" ]; then
            echo "找不到 Xcode 16+，无法运行 Swift Testing 用例" >&2
            exit 1
          fi
          sudo xcode-select -s "${newest}"
          swift --version

      - name: 单元测试
        run: swift test --package-path macos

      - name: 打包通用二进制
        run: ./macos/scripts/build-app.sh --universal

      - name: 断言产物是 arm64 + x86_64
        run: |
          bin="macos/dist/CampusEntry.app/Contents/MacOS/CampusEntry"
          test -x "${bin}"
          lipo -archs "${bin}"
          lipo -archs "${bin}" | grep -q arm64
          lipo -archs "${bin}" | grep -q x86_64

      - name: 校验签名
        run: codesign --verify --deep --strict macos/dist/CampusEntry.app

      - uses: actions/upload-artifact@v4
        with:
          name: CampusEntry-macOS
          path: macos/dist/CampusEntry-*.dmg
          if-no-files-found: error
          retention-days: 14
