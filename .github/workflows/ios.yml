name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v7

      # 先把环境事实打印出来：失败时也能从上一步的输出判断原因
      - name: 环境探测
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,40p'
          command -v xcodegen || true

      - name: 选择可用的最新 Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "选择 $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # 第一步：原样编译仓库内手写的工程文件，验证它本身能被 Xcode 打开并构建。
      # 必须用 -scheme：-derivedDataPath 与 -target 不能同时使用（xcodebuild 直接报错码 64）。
      - name: 工程自检与编译（仓库内工程）
        run: |
          set -x
          xcodebuild -list -project CampusEntry.xcodeproj
          xcodebuild -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData-check \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 第二步：按 project.yml 重建工程（工程结构的唯一事实来源）后执行单元测试
      - name: 重建工程
        run: |
          set -x
          mkdir -p build
          xcodegen generate --spec project.yml --project build/CampusEntry.xcodeproj

      - name: 单元测试
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime in devices for d in devices[runtime]
                   if d["name"].startswith("iPhone")]
          print(names[0])
          ')"
          echo "模拟器：$DEVICE"
          xcodebuild -project build/CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData-test \
            CODE_SIGNING_ALLOWED=NO \
            test
