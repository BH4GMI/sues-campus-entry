name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消尚未结束的旧运行：macOS runner 按 10 倍消耗额度，
# 被取代的运行没有保留价值。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v7

      # 先把环境事实打印出来：失败时也能从上一步的输出判断原因
      - name: 环境探测
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,40p'
          command -v xcodegen || true

      - name: 选择可用的最新 Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "选择 $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # 一次报出全部编译错误：xcodebuild 在第一个失败的编译任务之后会取消其余任务，
      # 每轮只能看到第一条错误。这一层用 swiftc 直接对全部源文件做类型检查，把反馈周期
      # 从「每轮一条」压到「每轮一批」。
      - name: 类型检查（一次报出全部错误）
        run: |
          set -x
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios17.0-simulator \
            -sdk "$SDK" \
            -swift-version 5 \
            -D DEBUG \
            $(find CampusEntry -name '*.swift' -print)

      # 第一步：原样编译仓库内手写的工程文件，验证它本身能被 Xcode 打开并构建。
      # 必须用 -scheme：-derivedDataPath 与 -target 不能同时使用（xcodebuild 直接报错码 64）。
      - name: 工程自检与编译（仓库内工程）
        run: |
          set -x
          xcodebuild -list -project CampusEntry.xcodeproj
          xcodebuild -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData-check \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 第二步：按 project.yml 就地重建工程（工程结构的唯一事实来源），再执行单元测试。
      # 就地重建：仓库内那份手写工程已在上一步验证过，这一步之后以重建结果为准。
      # XcodeGen 的 --project 参数取的是目录（会再拼一层 <name>.xcodeproj），不要用它指定文件。
      - name: 重建工程
        run: |
          set -x
          xcodegen generate --spec project.yml

      - name: 单元测试
        run: |
          set -euo pipefail
          # 用 UDID 指定模拟器：同一机型名会同时存在于多个 iOS 运行时下，
          # 按名字匹配会命中多个目标，xcodebuild 只取第一个并给出警告。
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d for runtime in devices for d in devices[runtime]
                   if d["name"].startswith("iPhone")]
          found.sort(key=lambda d: d["name"])
          print(found[0]["udid"])
          ')"
          xcrun simctl list devices available | grep "$UDID" || true
          xcodebuild -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData-test \
            CODE_SIGNING_ALLOWED=NO \
            test

      # 以上几步都面向模拟器 SDK。下面转向真机：先用同一思路做一次真机 SDK 的类型检查，
      # 把「只在 device 目标下才出现的编译错误」一次报全。Release 配置下 DEBUG 分支不参与编译，
      # 因此这一步同时覆盖 Release 专属的编译路径。
      - name: 类型检查（真机 SDK）
        run: |
          set -x
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -typecheck \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -swift-version 5 \
            $(find CampusEntry -name '*.swift' -print)

      # 产出未签名的真机归档：没有 Apple 开发者账号，也不该由仓库保管分发证书，
      # 因此这里只归档、不签名，由使用者在自己的机器上用重签工具安装。
      - name: 构建未签名真机归档
        run: |
          set -x
          xcodebuild archive \
            -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CampusEntry.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      # 归档产物是 .app，重签工具吃的是 .ipa，按 Payload/ 结构组装。
      # 同时把「能不能装到 iPad、装上是否完整」从工程里的声明落到产物本身核对：
      # 工程写的是意图，Info.plist 与包内容才是事实。
      - name: 组装未签名 ipa 并核对产物
        run: |
          set -euo pipefail
          APP="build/CampusEntry.xcarchive/Products/Applications/CampusEntry.app"
          if [ ! -d "$APP" ]; then
            echo "归档中没有 CampusEntry.app"; exit 1
          fi
          echo "最低系统版本：$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")"
          NAME="$(plutil -extract CFBundleDisplayName raw -o - "$APP/Info.plist")"
          echo "应用显示名：$NAME"
          if [ "$NAME" != "教务直达" ]; then
            echo "应用显示名不是「教务直达」"; exit 1
          fi
          FAMILY="$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")"
          echo "支持设备族：$FAMILY（1=iPhone，2=iPad）"
          case "$FAMILY" in
            *2*) ;;
            *) echo "Info.plist 未声明 iPad：UIDeviceFamily 缺少 2"; exit 1 ;;
          esac

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry CampusEntry-unsigned.ipa Payload)

          # 页面脚本必须真的进了真机包：少一个，页面契约就断一处。
          JS="$(unzip -l build/ipa/CampusEntry-unsigned.ipa | grep -c 'CampusEntry\.app/js/.*\.js$' || true)"
          echo "包内页面脚本数：$JS"
          if [ "$JS" -ne 13 ]; then
            echo "期望 13 个页面脚本，实际 $JS"; exit 1
          fi
          ls -lh build/ipa/CampusEntry-unsigned.ipa

      - name: 上传未签名 ipa
        uses: actions/upload-artifact@v5
        with:
          name: CampusEntry-unsigned-ipa
          path: ios/build/ipa/CampusEntry-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
