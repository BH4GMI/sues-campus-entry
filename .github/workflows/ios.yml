name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v7

      # 先把环境事实打印出来：失败时也能从上一步的输出判断原因
      - name: 环境探测
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,40p'
          command -v xcodegen || true

      - name: 选择可用的最新 Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "选择 $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # 一次报出全部编译错误：xcodebuild 在第一个失败的编译任务之后会取消其余任务，
      # 每轮只能看到第一条错误。这一层用 swiftc 直接对全部源文件做类型检查，把反馈周期
      # 从「每轮一条」压到「每轮一批」。
      - name: 类型检查（一次报出全部错误）
        run: |
          set -x
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios17.0-simulator \
            -sdk "$SDK" \
            -swift-version 5 \
            -D DEBUG \
            $(find CampusEntry -name '*.swift' -print)

      # 第一步：原样编译仓库内手写的工程文件，验证它本身能被 Xcode 打开并构建。
      # 必须用 -scheme：-derivedDataPath 与 -target 不能同时使用（xcodebuild 直接报错码 64）。
      - name: 工程自检与编译（仓库内工程）
        run: |
          set -x
          xcodebuild -list -project CampusEntry.xcodeproj
          xcodebuild -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData-check \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 第二步：按 project.yml 就地重建工程（工程结构的唯一事实来源），再执行单元测试。
      # 就地重建：仓库内那份手写工程已在上一步验证过，这一步之后以重建结果为准。
      # XcodeGen 的 --project 参数取的是目录（会再拼一层 <name>.xcodeproj），不要用它指定文件。
      - name: 重建工程
        run: |
          set -x
          xcodegen generate --spec project.yml

      - name: 单元测试
        run: |
          set -euo pipefail
          # 用 UDID 指定模拟器：同一机型名会同时存在于多个 iOS 运行时下，
          # 按名字匹配会命中多个目标，xcodebuild 只取第一个并给出警告。
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d for runtime in devices for d in devices[runtime]
                   if d["name"].startswith("iPhone")]
          found.sort(key=lambda d: d["name"])
          print(found[0]["udid"])
          ')"
          xcrun simctl list devices available | grep "$UDID" || true
          xcodebuild -project CampusEntry.xcodeproj \
            -scheme CampusEntry \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData-test \
            CODE_SIGNING_ALLOWED=NO \
            test
